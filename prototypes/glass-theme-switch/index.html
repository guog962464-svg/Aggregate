<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#131d28" />
    <title>光，在玻璃里转身</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", sans-serif;
        background: #131d28;
        color: #f5f7fa;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #131d28;
        user-select: none;
        -webkit-user-select: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #scene { z-index: 0; }
      #glass { z-index: 1; }

      #toggle {
        --focus-color: #bfe8ff;
        position: fixed;
        z-index: 2;
        top: 60%;
        left: 50%;
        width: min(78vw, 568px);
        height: 172px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        transform: translate(-50%, -50%);
        cursor: grab;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      #toggle:active { cursor: grabbing; }

      #toggle:focus { outline: none; }

      #toggle.keyboard-focus {
        outline: 2px solid var(--focus-color);
        outline-offset: 8px;
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--focus-color) 18%, transparent);
      }

      #fallback {
        display: none;
        position: fixed;
        z-index: 3;
        left: 50%;
        top: calc(60% + 122px);
        max-width: min(88vw, 420px);
        padding: 9px 13px;
        border: 1px solid #b8c8d4;
        border-radius: 8px;
        background: rgba(22, 32, 44, .92);
        color: #f5f7fa;
        font-size: 13px;
        text-align: center;
        transform: translateX(-50%);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 640px) {
        #toggle {
          top: 61%;
          width: 88vw;
          height: 112px;
        }

        #fallback { top: calc(61% + 88px); }
      }

      @media (max-height: 600px) and (min-width: 641px) {
        #toggle { top: 59%; height: 136px; }
        #fallback { top: calc(59% + 104px); }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <h1 id="page-title" class="sr-only">光，在玻璃里转身</h1>
      <p class="sr-only">明暗外观切换。可以拖动透镜、点击开关或使用方向键。移动时，像素图案会连续变形。</p>
      <canvas id="scene" aria-hidden="true"></canvas>
      <canvas id="glass" aria-hidden="true"></canvas>
      <button
        id="toggle"
        type="button"
        role="switch"
        aria-label="深色外观"
        aria-checked="false"
        aria-describedby="switch-help"
      ></button>
      <span id="switch-help" class="sr-only">点击、拖动或使用左右方向键切换页面外观。</span>
      <span id="switch-status" class="sr-only" aria-live="polite">已选择深色外观。</span>
      <p id="fallback" role="status">此页面需要 WebGL 才能绘制玻璃光学效果。仍可使用键盘切换外观。</p>
    </main>

    <script>
      (() => {
        'use strict';

        const sceneCanvas = document.querySelector('#scene');
        const glassCanvas = document.querySelector('#glass');
        const toggle = document.querySelector('#toggle');
        const status = document.querySelector('#switch-status');
        const fallback = document.querySelector('#fallback');
        const sceneContext = sceneCanvas.getContext('2d', { alpha: false, desynchronized: true });
        const matrixCanvas = document.createElement('canvas');
        const diffuseCanvas = document.createElement('canvas');
        const matrixContext = matrixCanvas.getContext('2d');
        const diffuseContext = diffuseCanvas.getContext('2d');
        const gl = glassCanvas.getContext('webgl', {
          alpha: true,
          antialias: true,
          premultipliedAlpha: false,
          preserveDrawingBuffer: false,
          powerPreference: 'high-performance',
        });
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
        const mix = (a, b, amount) => a + (b - a) * amount;
        const smoothstep = (low, high, value) => {
          const t = clamp((value - low) / (high - low), 0, 1);
          return t * t * (3 - 2 * t);
        };
        const mixRgb = (a, b, amount) => a.map((value, index) => Math.round(mix(value, b[index], amount)));
        const rgb = (value) => `rgb(${value[0]} ${value[1]} ${value[2]})`;
        let inputMode = 'pointer';

        const vertexSource = `
          attribute vec2 aPosition;
          void main() {
            gl_Position = vec4(aPosition, 0.0, 1.0);
          }
        `;

        // The scene canvas stays behind this renderer. The switch shader only
        // samples its own particle masks and synthesizes the surface beneath glass.
        const fragmentSource = `
          precision highp float;

          uniform vec2 uViewport;
          uniform vec2 uTrackSize;
          uniform float uCenterY;
          uniform float uKnobSize;
          uniform float uProgress;
          uniform float uDaylight;
          uniform float uBandAngle;
          uniform float uHover;
          uniform float uDpr;
          uniform float uEnergy;
          uniform sampler2D uMatrix;
          uniform sampler2D uDiffuse;

          float sdRoundBox(vec2 p, vec2 halfSize, float radius) {
            vec2 q = abs(p) - halfSize + vec2(radius);
            return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - radius;
          }

          vec2 sdNormal(vec2 p, vec2 halfSize, float radius) {
            float e = 0.65;
            return normalize(vec2(
              sdRoundBox(p + vec2(e, 0.0), halfSize, radius) - sdRoundBox(p - vec2(e, 0.0), halfSize, radius),
              sdRoundBox(p + vec2(0.0, e), halfSize, radius) - sdRoundBox(p - vec2(0.0, e), halfSize, radius)
            ) + vec2(0.0001));
          }

          vec2 knobCenter() {
            float travel = max(0.0, (uTrackSize.x - uKnobSize) * 0.5 - 11.0);
            return vec2((uProgress - 0.5) * 2.0 * travel, 0.0);
          }

          float knobDistance(vec2 point) {
            float radius = uKnobSize * 0.293;
            return sdRoundBox(point - knobCenter(), vec2(uKnobSize * 0.5), radius);
          }

          float stripDistance(vec2 point) {
            vec2 offset = point - knobCenter();
            float angularError = atan(sin(atan(offset.y, offset.x) - uBandAngle),
                                      cos(atan(offset.y, offset.x) - uBandAngle));
            float radius = uKnobSize * 0.293;
            vec2 deviation = vec2(knobDistance(point) - uKnobSize * 0.035,
                max(abs(angularError) - 0.92, 0.0) * uKnobSize * 0.72);
            return length(deviation) - uKnobSize * 0.009;
          }

          vec3 lampColor() {
            return mix(vec3(0.435, 0.525, 1.0), vec3(1.0, 0.659, 0.180), uDaylight);
          }

          vec3 illuminate(vec3 surface, float amount, vec3 lamp) {
            float coverage = min(0.88, 1.0 - exp(-amount * 1.3));
            vec3 tinted = mix(surface, lamp * 1.04 + 0.03, coverage);
            return mix(surface + lamp * amount, tinted, uDaylight);
          }

          float sampleMask(vec2 point, bool diffuse) {
            vec2 uv = point / uTrackSize + 0.5;
            if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return 0.0;
            return diffuse ? texture2D(uDiffuse, uv).a : texture2D(uMatrix, uv).a;
          }

          vec4 underneath(vec2 point, float softness, vec2 chromatic, vec3 lamp) {
            vec2 trackHalf = uTrackSize * 0.5;
            float edge = sdRoundBox(point - vec2(0.0, 7.0), trackHalf, min(72.0, uTrackSize.y * 0.32));
            float shade = 1.0 - smoothstep(-14.0, 3.0, edge);
            vec3 floorColor = mix(vec3(0.026, 0.034, 0.046), vec3(0.895, 0.920, 0.910), uDaylight);
            floorColor *= 1.0 + point.y / max(trackHalf.y, 1.0) * mix(0.05, 0.012, uDaylight);
            floorColor = mix(floorColor * (1.0 - shade * 0.60), floorColor - shade * 0.085, uDaylight);
            float distanceToLight = max(stripDistance(point), 0.0);
            float wash = (0.85 * exp(-distanceToLight / 14.0) + 0.32 * exp(-distanceToLight / 55.0)) * uEnergy;
            floorColor = illuminate(floorColor, wash * 0.55, lamp);

            vec3 sharp = vec3(sampleMask(point - chromatic, false), sampleMask(point, false), sampleMask(point + chromatic, false));
            vec3 soft = vec3(sampleMask(point - chromatic, true), sampleMask(point, true), sampleMask(point + chromatic, true));
            vec3 coverage = clamp(mix(sharp, soft * 1.35, softness), 0.0, 1.0);
            float brightFloor = smoothstep(0.40, 0.56, dot(floorColor, vec3(0.299, 0.587, 0.114)));
            vec3 ink = mix(vec3(0.93, 0.975, 1.0), vec3(0.13, 0.105, 0.085), brightFloor);
            ink += mix(lamp * wash * 0.9, vec3(0.25, 0.08, 0.0) * wash, uDaylight);
            vec3 result = mix(floorColor, ink, coverage);
            result += vec3(1.0, 0.78, 0.55) * sampleMask(point, true) * 0.64 * (1.0 - uDaylight);
            return vec4(result, coverage.g);
          }

          void main() {
            vec2 screenPoint = vec2(gl_FragCoord.x / uDpr, uViewport.y - gl_FragCoord.y / uDpr);
            vec2 point = screenPoint - vec2(uViewport.x * 0.5, uCenterY);
            vec2 trackHalf = uTrackSize * 0.5;
            float trackRadius = min(72.0, uTrackSize.y * 0.43);
            float dTrack = sdRoundBox(point, trackHalf, trackRadius);
            float trackMask = 1.0 - smoothstep(-1.0, 1.25, dTrack);
            vec3 lamp = lampColor();

            vec3 trackColor = underneath(point, 0.0, vec2(0.0), lamp).rgb;
            float handleShade = 1.0 - smoothstep(-8.0, 20.0, knobDistance(point - vec2(0.0, 7.0)));
            trackColor *= 1.0 - handleShade * mix(0.60, 0.20, uDaylight);
            float rim = 1.0 - smoothstep(0.0, 1.3, abs(dTrack + 0.75));
            float lower = smoothstep(-trackHalf.y * 0.60, trackHalf.y, point.y);
            trackColor += rim * mix(mix(0.035, 0.09, lower), mix(-0.07, 0.07, lower), uDaylight);

            float dKnob = knobDistance(screenPoint - vec2(uViewport.x * 0.5, uCenterY));
            float lens = 1.0 - smoothstep(-0.8, 1.15, dKnob);
            vec2 local = screenPoint - vec2(uViewport.x * 0.5, uCenterY) - knobCenter();
            vec2 normal = sdNormal(local, vec2(uKnobSize * 0.5), uKnobSize * 0.293);
            float depth = max(-dKnob, 0.0);
            float bevel = pow(1.0 - clamp(depth / (uKnobSize * 0.13), 0.0, 1.0), 2.6);
            vec2 insetPoint = point - normal * (2.5 + bevel * 8.0) - local * 0.025;
            vec2 chromatic = normal * bevel * 3.2 + local * 0.006;
            vec4 content = underneath(insetPoint, 0.06 + 0.76 * bevel, chromatic, lamp);
            float vertical = clamp((local.y + uKnobSize * 0.5) / uKnobSize, 0.0, 1.0);
            vec3 shadedGlass = content.rgb * 0.84 + 0.135 * (1.0 - vertical * 0.55);
            vec3 paleGlass = mix(content.rgb, vec3(0.99), 0.5 * (1.0 - content.a * 0.8));
            vec3 glass = mix(shadedGlass, paleGlass, uDaylight);
            float glowDistance = max(stripDistance(point), 0.0);
            float scattering = (exp(-glowDistance / 24.0) * 0.8 + exp(-glowDistance / 64.0) * 0.2) * uEnergy;
            glass = illuminate(glass, scattering * 0.8, lamp);
            glass = illuminate(glass, exp(-depth / 2.2) * exp(-glowDistance / 40.0) * uEnergy * 1.3, lamp);
            float lighting = dot(normal, normalize(vec2(-0.35, -1.0)));
            glass += pow(max(lighting, 0.0), 2.0) * exp(-depth / 1.25) * mix(0.42, 0.7, uDaylight);
            glass += max(lighting, 0.0) * bevel * mix(0.07, 0.16, uDaylight);
            glass *= 1.0 - max(-lighting, 0.0) * bevel * mix(0.28, 0.07, uDaylight);
            glass += exp(-depth / 0.7) * mix(0.07, 0.12, uDaylight);

            float strip = stripDistance(point);
            float emitter = 1.0 - smoothstep(-uKnobSize * 0.004, uKnobSize * 0.004, strip);
            vec3 hotLamp = mix(lamp * 1.05, mix(lamp, vec3(1.0), 0.65), 1.0 - smoothstep(-uKnobSize * 0.01, -uKnobSize * 0.001, strip));
            trackColor = mix(trackColor, hotLamp * (0.8 + 0.35 * uEnergy), emitter);

            float outside = 1.0 - trackMask;
            float shadow = exp(-pow(max(dTrack, 0.0) / 15.0, 1.25)) * 0.16 * outside;
            float spill = (0.85 * exp(-max(strip, 0.0) / 18.0) + 0.34 * exp(-max(strip, 0.0) / 70.0)) * uEnergy * (0.23 + uHover * 0.025) * outside;
            float outsideAlpha = max(shadow, spill);
            vec3 outsideColor = mix(vec3(0.012, 0.018, 0.025), lamp * 0.92, spill / max(outsideAlpha, 0.0001));
            vec3 color = mix(outsideColor, trackColor, trackMask);
            color = mix(color, glass, lens);
            color = mix(color, hotLamp * (0.8 + 0.35 * uEnergy), emitter);
            float alpha = max(outsideAlpha, max(trackMask, lens));
            gl_FragColor = vec4(clamp(color, 0.0, 1.0), clamp(alpha, 0.0, 1.0));
          }
        `;

        let program = null;
        let positionLocation = -1;
        let matrixTexture = null;
        let diffuseTexture = null;
        let uniforms = null;

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            const message = gl.getShaderInfoLog(shader);
            gl.deleteShader(shader);
            throw new Error(message || 'Shader compilation failed.');
          }
          return shader;
        }

        function createTexture(unit, uniformName) {
          const texture = gl.createTexture();
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.uniform1i(gl.getUniformLocation(program, uniformName), unit);
          return texture;
        }

        function setupWebGL() {
          if (!gl) return false;
          try {
            const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
            const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
            program = gl.createProgram();
            gl.attachShader(program, vertex);
            gl.attachShader(program, fragment);
            gl.linkProgram(program);
            gl.deleteShader(vertex);
            gl.deleteShader(fragment);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
              throw new Error(gl.getProgramInfoLog(program) || 'WebGL program link failed.');
            }
            gl.useProgram(program);
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            positionLocation = gl.getAttribLocation(program, 'aPosition');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
            matrixTexture = createTexture(0, 'uMatrix');
            diffuseTexture = createTexture(1, 'uDiffuse');
            gl.activeTexture(gl.TEXTURE0);
            uniforms = {
              viewport: gl.getUniformLocation(program, 'uViewport'),
              trackSize: gl.getUniformLocation(program, 'uTrackSize'),
              centerY: gl.getUniformLocation(program, 'uCenterY'),
              knobSize: gl.getUniformLocation(program, 'uKnobSize'),
              progress: gl.getUniformLocation(program, 'uProgress'),
              daylight: gl.getUniformLocation(program, 'uDaylight'),
              bandAngle: gl.getUniformLocation(program, 'uBandAngle'),
              hover: gl.getUniformLocation(program, 'uHover'),
              dpr: gl.getUniformLocation(program, 'uDpr'),
              energy: gl.getUniformLocation(program, 'uEnergy'),
            };
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            return true;
          } catch (error) {
            console.error(error);
            return false;
          }
        }

        const gridSize = 17;
        const centerCell = 8;
        const pixelPitch = 5.7;
        const basePixelSize = 4.6;
        const morphSpan = 0.62;
        const moonCells = [];
        const sunCells = [];

        for (let y = 0; y < gridSize; y += 1) {
          for (let x = 0; x < gridSize; x += 1) {
            const dx = x - centerCell;
            const dy = y - centerCell;
            const shadowX = x - 11.3;
            const shadowY = y - 5.6;
            const body = dx * dx + dy * dy <= 6.6 * 6.6;
            const shadow = shadowX * shadowX + shadowY * shadowY <= 5.4 * 5.4;
            if (body && !shadow) {
              const dimmed = (x === 3 && y === 9) || (x === 6 && y === 12) || (x === 4 && y === 12);
              moonCells.push({ x, y, brightness: dimmed ? 0.5 : 1, kind: 'body' });
            } else if (body && (x + y) % 2 === 0) {
              moonCells.push({ x, y, brightness: 0.2, kind: 'shadow' });
            }
          }
        }
        [
          [15, 1, 1], [14, 1, 0.45], [16, 1, 0.45], [15, 0, 0.45], [15, 2, 0.45], [11, 0, 0.75], [16, 5, 0.6],
        ].forEach(([x, y, brightness]) => moonCells.push({ x, y, brightness, kind: 'star' }));

        const sunCellMap = new Map();
        function addSunCell(x, y, kind, angle = 0) {
          const key = `${x},${y}`;
          if (!sunCellMap.has(key)) sunCellMap.set(key, { x, y, brightness: 1, kind, angle });
        }
        for (let y = 0; y < gridSize; y += 1) {
          for (let x = 0; x < gridSize; x += 1) {
            const dx = x - centerCell;
            const dy = y - centerCell;
            if (dx * dx + dy * dy <= 3.7 * 3.7) addSunCell(x, y, 'core');
          }
        }
        for (let ray = 0; ray < 8; ray += 1) {
          const rayAngle = ray * Math.PI / 4;
          const lengths = ray % 2 ? [5.9, 7.2] : [5.6, 6.6, 7.6];
          lengths.forEach((radius) => addSunCell(
            Math.round(centerCell + Math.cos(rayAngle) * radius),
            Math.round(centerCell + Math.sin(rayAngle) * radius),
            'ray',
            rayAngle,
          ));
        }
        const sunCellsResolved = [...sunCellMap.values()];

        function cellAngle(cell) {
          const dx = cell.x - centerCell;
          const dy = cell.y - centerCell;
          return (Math.atan2(dy, dx) + Math.PI * 0.75 + Math.PI * 2) % (Math.PI * 2)
            + Math.hypot(dx, dy) * 0.001;
        }
        moonCells.sort((a, b) => cellAngle(a) - cellAngle(b));
        sunCellsResolved.sort((a, b) => cellAngle(a) - cellAngle(b));

        function hash(value) {
          const raw = Math.sin(value * 127.1 + 311.7) * 43758.5453;
          return raw - Math.floor(raw);
        }
        function between(value, min, max) { return min + (max - min) * hash(value); }
        const moonHasMore = moonCells.length >= sunCellsResolved.length;
        const larger = moonHasMore ? moonCells : sunCellsResolved;
        const smaller = moonHasMore ? sunCellsResolved : moonCells;
        let previousSmallIndex = -1;
        const particles = larger.map((largeCell, index) => {
          const smallIndex = Math.floor(index * smaller.length / larger.length);
          let smallCell = smaller[smallIndex];
          if (smallIndex === previousSmallIndex) smallCell = { ...smallCell, brightness: 0 };
          previousSmallIndex = smallIndex;
          const moon = moonHasMore ? largeCell : smallCell;
          const sun = moonHasMore ? smallCell : largeCell;
          return {
            moon,
            sun,
            delay: 0.04 + (1 - moon.x / (gridSize - 1)) * 0.26 + between(index + 1, 0, 0.06),
            curl: between(index + 53, -1, 1) * 16 + (moon.y - centerCell) * 0.9,
            radialLift: between(index + 103, 2, 12),
            stiffness: between(index + 151, 260, 460),
            drag: between(index + 197, 0.004, 0.016),
            phase: between(index + 251, 0, Math.PI * 2),
            twinkleRate: between(index + 307, 1.5, 3.2),
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
          };
        });
        const animatedIcon = particles.some((particle) => particle.moon.kind === 'star' || particle.sun.kind === 'ray');

        const state = {
          width: 0,
          height: 0,
          dpr: 1,
          trackWidth: 0,
          trackHeight: 0,
          knobSize: 0,
          centerY: 0,
          progress: 0,
          target: 0,
          velocity: 0,
          daylight: 0,
          phase: 0,
          phaseVelocity: 0,
          bandAngle: Math.PI * 0.5,
          hover: 0,
          hoverTarget: 0,
          kick: 0,
          dragging: false,
          pointer: null,
          accumulator: 0,
          lastFrame: 0,
          time: 0,
          light: false,
          suppressSyntheticClickUntil: 0,
        };

        function cubicInOut(value) {
          const t = clamp(value, 0, 1);
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function particleGoal(particle, progress) {
          const blend = cubicInOut((progress - particle.delay) / morphSpan);
          const startX = (particle.moon.x - centerCell) * pixelPitch;
          const startY = (particle.moon.y - centerCell) * pixelPitch;
          const endX = (particle.sun.x - centerCell) * pixelPitch;
          const endY = (particle.sun.y - centerCell) * pixelPitch;
          const dx = endX - startX;
          const dy = endY - startY;
          const distance = Math.hypot(dx, dy) || 1;
          const arc = Math.sin(Math.PI * blend);
          let x = startX + dx * blend - dy / distance * particle.curl * 1.62 * arc;
          let y = startY + dy * blend + dx / distance * particle.curl * 1.62 * arc;
          const radius = Math.hypot(x, y) || 1;
          const expansion = particle.radialLift * arc * 1.4 * 0.38;
          x += x / radius * expansion;
          y += y / radius * expansion;

          let moonBrightness = particle.moon.brightness;
          let sunBrightness = particle.sun.brightness;
          if (particle.moon.kind === 'star') {
            const twinkle = Math.sin(state.time * particle.twinkleRate + particle.phase);
            moonBrightness *= 0.45 + 0.55 * twinkle * twinkle;
          }
          if (particle.sun.kind === 'ray') {
            sunBrightness *= 0.78 + 0.22 * (0.5 + 0.5 * Math.sin(state.time * 2.2 + 0.505 - particle.sun.angle));
          }
          return {
            x,
            y,
            brightness: (moonBrightness + (sunBrightness - moonBrightness) * blend) * (1 + 0.3 * arc),
            size: basePixelSize * (1 - 0.45 * arc),
          };
        }

        function snapParticles(progress) {
          for (const particle of particles) {
            const goal = particleGoal(particle, progress);
            particle.x = goal.x;
            particle.y = goal.y;
            particle.vx = 0;
            particle.vy = 0;
          }
        }
        snapParticles(0);

        function ensureTextureSize() {
          const matrixWidth = Math.max(1, Math.round(state.trackWidth * state.dpr * 2));
          const matrixHeight = Math.max(1, Math.round(state.trackHeight * state.dpr * 2));
          const diffuseWidth = Math.max(1, Math.round(state.trackWidth * state.dpr));
          const diffuseHeight = Math.max(1, Math.round(state.trackHeight * state.dpr));
          if (matrixCanvas.width !== matrixWidth || matrixCanvas.height !== matrixHeight) {
            matrixCanvas.width = matrixWidth;
            matrixCanvas.height = matrixHeight;
          }
          if (diffuseCanvas.width !== diffuseWidth || diffuseCanvas.height !== diffuseHeight) {
            diffuseCanvas.width = diffuseWidth;
            diffuseCanvas.height = diffuseHeight;
          }
        }

        function measure() {
          const width = window.innerWidth;
          const height = window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const trackWidth = Math.min(width * (width <= 640 ? 0.88 : 0.78), 568);
          const trackHeight = Math.min(width <= 640 ? 112 : 172, Math.max(112, trackWidth * 0.302));
          const knobSize = Math.min(148, trackHeight - 18);
          state.width = width;
          state.height = height;
          state.dpr = dpr;
          state.trackWidth = trackWidth;
          state.trackHeight = trackHeight;
          state.knobSize = knobSize;
          state.centerY = height * (width <= 640 ? 0.61 : height <= 600 ? 0.59 : 0.60);

          const pixelWidth = Math.round(width * dpr);
          const pixelHeight = Math.round(height * dpr);
          if (sceneCanvas.width !== pixelWidth || sceneCanvas.height !== pixelHeight) {
            sceneCanvas.width = pixelWidth;
            sceneCanvas.height = pixelHeight;
          }
          if (glassCanvas.width !== pixelWidth || glassCanvas.height !== pixelHeight) {
            glassCanvas.width = pixelWidth;
            glassCanvas.height = pixelHeight;
            if (gl) gl.viewport(0, 0, pixelWidth, pixelHeight);
          }
          ensureTextureSize();
          toggle.style.width = `${trackWidth}px`;
          toggle.style.height = `${trackHeight}px`;
          toggle.style.top = `${state.centerY}px`;
        }

        function drawScene() {
          const { width: w, height: h, dpr, daylight } = state;
          const ctx = sceneContext;
          const bgTop = mixRgb([18, 27, 39], [244, 246, 241], daylight);
          const bgMid = mixRgb([22, 34, 47], [233, 238, 235], daylight);
          const bgBottom = mixRgb([28, 45, 57], [216, 227, 229], daylight);
          const ink = daylight < 0.5 ? [250, 252, 253] : [13, 25, 34];
          const secondary = daylight < 0.5 ? [226, 236, 243] : [31, 46, 56];
          const accent = mixRgb([104, 189, 243], [216, 139, 68], daylight);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);

          const backdrop = ctx.createLinearGradient(0, 0, 0, h);
          backdrop.addColorStop(0, rgb(bgTop));
          backdrop.addColorStop(0.53, rgb(bgMid));
          backdrop.addColorStop(1, rgb(bgBottom));
          ctx.fillStyle = backdrop;
          ctx.fillRect(0, 0, w, h);

          const centerX = w * 0.5;
          const glow = ctx.createRadialGradient(centerX, state.centerY, 0, centerX, state.centerY, Math.max(w, h) * 0.56);
          const glowColor = daylight < 0.5 ? `rgba(57, 131, 183, ${0.13 * (1 - daylight * 0.7)})` : `rgba(246, 195, 119, ${0.16 * daylight})`;
          glow.addColorStop(0, glowColor);
          glow.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, w, h);

          ctx.save();
          ctx.globalAlpha = 0.075 + 0.035 * (1 - daylight);
          ctx.strokeStyle = rgb(mixRgb([132, 162, 184], [92, 110, 119], daylight));
          ctx.lineWidth = 1;
          for (let x = 18; x < w; x += 54) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();
          }
          for (let y = 18; y < h; y += 54) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = `rgba(${accent.join(',')}, ${0.10 + daylight * 0.025})`;
          ctx.lineWidth = 1;
          const orbitalRadius = Math.min(w, h) * 0.24;
          [0.76, 1, 1.24].forEach((scale) => {
            ctx.beginPath();
            ctx.ellipse(centerX, state.centerY, orbitalRadius * scale, orbitalRadius * scale * 0.7, 0, 0, Math.PI * 2);
            ctx.stroke();
          });
          ctx.restore();

          ctx.save();
          ctx.fillStyle = rgb(secondary);
          ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Avenir Next", sans-serif';
          ctx.fillText('光学试验 / 01', Math.max(28, w * 0.09), Math.max(38, h * 0.105));
          ctx.textAlign = 'right';
          ctx.fillText('独立场景     实时', w - Math.max(28, w * 0.09), Math.max(38, h * 0.105));
          ctx.textAlign = 'left';

          const left = Math.max(28, w * 0.09);
          const titleY = Math.max(128, h * 0.245);
          const titleSize = w <= 520 ? 39 : w <= 900 ? 48 : 58;
          ctx.fillStyle = rgb(ink);
          ctx.font = `400 ${titleSize}px Georgia, "Songti SC", "STSong", serif`;
          ctx.fillText('光，在玻璃里', left, titleY);
          ctx.fillText('转个身。', left, titleY + titleSize * 1.05);
          ctx.fillStyle = rgb(secondary);
          ctx.font = '400 14px -apple-system, BlinkMacSystemFont, "Avenir Next", sans-serif';
          ctx.fillText('拖动透镜，让像素与昼夜一同改变。', left + 2, titleY + titleSize * 2.18);
          const tagY = h <= 540 ? 52 : h - 68;
          ctx.fillStyle = rgb(secondary);
          ctx.font = '500 10px -apple-system, BlinkMacSystemFont, "Avenir Next", sans-serif';
          ctx.fillText('拖动  /  点击  /  使用方向键', left, tagY);
          ctx.textAlign = 'right';
          ctx.fillText(daylight < 0.5 ? '夜晚  ·  2700 K' : '白昼  ·  6500 K', w - left, tagY);
          ctx.restore();
        }

        function drawParticleTextures() {
          ensureTextureSize();
          const { dpr, trackWidth, trackHeight, knobSize, progress } = state;
          const matrixScale = dpr * 2;
          matrixContext.setTransform(matrixScale, 0, 0, matrixScale, 0, 0);
          matrixContext.clearRect(0, 0, trackWidth, trackHeight);
          const travel = Math.max(0, (trackWidth - knobSize) * 0.5 - 11);
          const knobOffset = (clamp(progress, 0, 1) - 0.5) * 2 * travel;
          const iconScale = knobSize / 198;
          for (const particle of particles) {
            const goal = particleGoal(particle, clamp(progress, 0, 1));
            const inertia = clamp(-state.velocity * travel * particle.drag, -14, 14);
            const x = trackWidth * 0.5 + knobOffset + particle.x * iconScale + inertia * iconScale;
            const y = trackHeight * 0.5 + particle.y * iconScale;
            const size = goal.size * iconScale;
            if (goal.brightness <= 0.002) continue;
            matrixContext.fillStyle = `rgba(255,255,255,${clamp(goal.brightness, 0, 1)})`;
            matrixContext.fillRect(x - size * 0.5, y - size * 0.5, size, size);
          }

          diffuseContext.setTransform(dpr, 0, 0, dpr, 0, 0);
          diffuseContext.clearRect(0, 0, trackWidth, trackHeight);
          diffuseContext.filter = 'blur(4px)';
          diffuseContext.drawImage(matrixCanvas, 0, 0, trackWidth, trackHeight);
          diffuseContext.filter = 'none';
        }

        function syncSemantics() {
          const isLight = clamp(state.progress, 0, 1) >= 0.5;
          const changed = isLight !== state.light;
          state.light = isLight;
          toggle.setAttribute('aria-checked', String(isLight));
          toggle.setAttribute('aria-label', isLight ? '浅色外观' : '深色外观');
          toggle.style.setProperty('--focus-color', isLight ? '#76501f' : '#bfe8ff');
          if (changed) status.textContent = `已选择${isLight ? '浅色' : '深色'}外观。`;
        }

        function cubicTheme(value) { return smoothstep(0.18, 0.82, clamp(value, 0, 1)); }

        function snapTo(target) {
          state.target = target ? 1 : 0;
          state.progress = state.target;
          state.velocity = 0;
          state.phase = state.target;
          state.phaseVelocity = 0;
          state.bandAngle = Math.PI * 0.5 - Math.PI * state.target;
          state.kick = 0;
          snapParticles(state.progress);
        }

        function settleTo(target) {
          state.target = target ? 1 : 0;
          state.kick = 1;
          if (reducedMotion.matches) snapTo(state.target);
          syncSemantics();
          requestRender();
        }

        document.addEventListener('keydown', () => { inputMode = 'keyboard'; }, true);
        document.addEventListener('pointerdown', () => { inputMode = 'pointer'; }, true);
        toggle.addEventListener('focus', () => {
          if (inputMode === 'keyboard') toggle.classList.add('keyboard-focus');
        });
        toggle.addEventListener('blur', () => toggle.classList.remove('keyboard-focus'));

        function progressFromPointer(clientX, offset) {
          const rect = toggle.getBoundingClientRect();
          const centerX = rect.left + rect.width * 0.5;
          const travel = Math.max(1, (state.trackWidth - state.knobSize) * 0.5 - 11);
          const thumbX = clientX - offset;
          return clamp((thumbX - (centerX - travel)) / (2 * travel), 0, 1);
        }

        let frameRequest = 0;
        function requestRender() {
          if (!frameRequest) frameRequest = requestAnimationFrame(render);
        }

        toggle.addEventListener('pointerdown', (event) => {
          if (event.button !== undefined && event.button !== 0) return;
          toggle.classList.remove('keyboard-focus');
          event.preventDefault();
          toggle.focus({ preventScroll: true });
          const rect = toggle.getBoundingClientRect();
          const centerX = rect.left + rect.width * 0.5;
          const centerY = rect.top + rect.height * 0.5;
          const travel = Math.max(1, (state.trackWidth - state.knobSize) * 0.5 - 11);
          const thumbX = centerX + (clamp(state.progress, 0, 1) - 0.5) * 2 * travel;
          const insideThumb = Math.abs(event.clientX - thumbX) < state.knobSize * 0.52
            && Math.abs(event.clientY - centerY) < state.knobSize * 0.52;
          state.pointer = {
            id: event.pointerId,
            downX: event.clientX,
            downY: event.clientY,
            lastX: event.clientX,
            lastTime: event.timeStamp,
            startTarget: state.target,
            grabOffset: insideThumb ? event.clientX - thumbX : 0,
            insideThumb,
            moved: false,
            dragging: false,
          };
          state.dragging = false;
          if (toggle.setPointerCapture) toggle.setPointerCapture(event.pointerId);
          requestRender();
        });

        toggle.addEventListener('pointermove', (event) => {
          const pointer = state.pointer;
          if (!pointer || pointer.id !== event.pointerId) return;
          const dx = event.clientX - pointer.downX;
          const dy = event.clientY - pointer.downY;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) pointer.moved = true;
          if (pointer.insideThumb && !reducedMotion.matches
              && !pointer.dragging && Math.abs(dx) > 4 && Math.abs(dx) > Math.abs(dy)) {
            pointer.dragging = true;
            state.dragging = true;
          }
          if (pointer.dragging) {
            const next = progressFromPointer(event.clientX, pointer.grabOffset);
            const dt = Math.max(0.001, (event.timeStamp - pointer.lastTime) / 1000);
            const instantaneous = (next - state.progress) / dt;
            state.velocity = state.velocity * 0.6 + instantaneous * 0.4;
            state.progress = next;
            state.target = next;
            syncSemantics();
          }
          pointer.lastX = event.clientX;
          pointer.lastTime = event.timeStamp;
          requestRender();
        });

        function finishPointer(event, cancelled = false) {
          const pointer = state.pointer;
          if (!pointer || pointer.id !== event.pointerId) return;
          state.pointer = null;
          state.dragging = false;
          if (toggle.hasPointerCapture?.(event.pointerId)) toggle.releasePointerCapture(event.pointerId);
          if (cancelled) {
            settleTo(pointer.startTarget > 0.5);
          } else if (pointer.dragging) {
            settleTo(state.progress + state.velocity * 0.15 > 0.5);
          } else if (!pointer.moved) {
            settleTo(clamp(state.progress, 0, 1) < 0.5);
          }
          requestRender();
        }
        toggle.addEventListener('pointerup', (event) => finishPointer(event));
        toggle.addEventListener('pointercancel', (event) => finishPointer(event, true));

        toggle.addEventListener('click', (event) => {
          if (event.detail === 0 && !state.pointer) {
            if (performance.now() < state.suppressSyntheticClickUntil) {
              state.suppressSyntheticClickUntil = 0;
              return;
            }
            settleTo(clamp(state.progress, 0, 1) < 0.5);
          }
        });

        toggle.addEventListener('keydown', (event) => {
          toggle.classList.add('keyboard-focus');
          if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
            event.preventDefault();
            settleTo(true);
          } else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
            event.preventDefault();
            settleTo(false);
          } else if (event.key === ' ' || event.key === 'Enter') {
            event.preventDefault();
            if (!event.repeat) {
              state.suppressSyntheticClickUntil = performance.now() + 350;
              settleTo(clamp(state.progress, 0, 1) < 0.5);
            }
          }
        });

        toggle.addEventListener('pointerenter', () => { state.hoverTarget = 1; requestRender(); });
        toggle.addEventListener('pointerleave', () => { state.hoverTarget = 0; requestRender(); });

        function simulationStep(step, time) {
          state.time = time;
          if (!state.dragging) {
            const stiffness = 129;
            const damping = 2 * Math.sqrt(stiffness) * 0.6;
            const substep = step / 4;
            for (let i = 0; i < 4; i += 1) {
              const acceleration = -stiffness * (state.progress - state.target) - damping * state.velocity;
              state.velocity += acceleration * substep;
              state.progress += state.velocity * substep;
            }
          }
          state.hover += (state.hoverTarget - state.hover) * Math.min(1, step * 10);
          state.kick *= Math.exp(-step * 3.5);
          const visualProgress = clamp(state.progress, 0, 1);
          const phaseTarget = cubicInOut(visualProgress);
          const phaseAcceleration = -59.0864 * (state.phase - phaseTarget)
            - 2 * Math.sqrt(59.0864) * 0.9447 * state.phaseVelocity;
          state.phaseVelocity += phaseAcceleration * step;
          state.phase += state.phaseVelocity * step;
          state.bandAngle = Math.PI * 0.5 - Math.PI * clamp(state.phase, 0, 1);

          for (const particle of particles) {
            const goal = particleGoal(particle, visualProgress);
            const damping = 2 * Math.sqrt(particle.stiffness) * 0.72;
            particle.vx += (-particle.stiffness * (particle.x - goal.x) - damping * particle.vx) * step;
            particle.vy += (-particle.stiffness * (particle.y - goal.y) - damping * particle.vy) * step;
            particle.x += particle.vx * step;
            particle.y += particle.vy * step;
          }
        }

        function render(timestamp) {
          frameRequest = 0;
          const now = timestamp * 0.001;
          const rawDt = state.lastFrame ? Math.max(0, now - state.lastFrame) : 1 / 60;
          state.lastFrame = now;
          if (rawDt > 2 && !state.dragging) {
            snapTo(state.target > 0.5);
          } else {
            state.accumulator += Math.min(rawDt, 2);
            let steps = 0;
            while (state.accumulator + 1e-9 >= 1 / 60 && steps < 120) {
              const stepTime = now - state.accumulator + 1 / 60;
              simulationStep(1 / 60, stepTime);
              state.accumulator = Math.max(0, state.accumulator - 1 / 60);
              steps += 1;
            }
            state.time = now;
          }
          state.daylight = cubicTheme(state.progress);
          syncSemantics();
          drawScene();
          drawParticleTextures();

          if (gl && program) {
            gl.useProgram(program);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, matrixTexture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, matrixCanvas);
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, diffuseTexture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, diffuseCanvas);
            gl.uniform2f(uniforms.viewport, state.width, state.height);
            gl.uniform2f(uniforms.trackSize, state.trackWidth, state.trackHeight);
            gl.uniform1f(uniforms.centerY, state.centerY);
            gl.uniform1f(uniforms.knobSize, state.knobSize);
            gl.uniform1f(uniforms.progress, clamp(state.progress, 0, 1));
            gl.uniform1f(uniforms.daylight, state.daylight);
            gl.uniform1f(uniforms.bandAngle, state.bandAngle);
            gl.uniform1f(uniforms.hover, state.hover);
            gl.uniform1f(uniforms.dpr, state.dpr);
            gl.uniform1f(uniforms.energy, 1 + state.hover * 0.08 + Math.min(Math.abs(state.velocity) * 0.05, 0.18) + state.kick * 0.12);
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }

          const moving = state.dragging
            || Math.abs(state.target - state.progress) > 0.0007
            || Math.abs(state.velocity) > 0.003
            || Math.abs(state.phaseVelocity) > 0.003
            || Math.abs(state.hoverTarget - state.hover) > 0.01
            || state.kick > 0.002
            || particles.some((particle) => Math.abs(particle.vx) + Math.abs(particle.vy) > 0.02);
          // Keep the shared clock alive at rest for star twinkle and sun-ray shimmer.
          if ((moving || animatedIcon) && !reducedMotion.matches) requestRender();
        }

        measure();
        window.addEventListener('resize', () => { measure(); requestRender(); }, { passive: true });
        reducedMotion.addEventListener?.('change', () => {
          if (reducedMotion.matches) settleTo(state.target > 0.5);
          else requestRender();
        });
        if (!setupWebGL()) fallback.style.display = 'block';
        requestRender();
      })();
    </script>
  </body>
</html>
