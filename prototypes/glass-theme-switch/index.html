<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151b20" />
    <title>设置 · Aggregate</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", sans-serif;
        color: #efeff3;
        background: #151b20;
        --surface: #202126;
        --raised: #292b32;
        --text: #efeff3;
        --muted: #b8bac5;
        --line: #35363e;
        --glow: #8b9aff;
        --focus: #8b9aff;
        --ink: #f4efdf;
      }
      body.is-day {
        color-scheme: light;
        --surface: #f3f3f5;
        --raised: #fbfbfc;
        --text: #27272f;
        --muted: #656571;
        --line: #c9c9d2;
        --glow: #b06520;
        --focus: #6f3c0d;
        --ink: #4f493b;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { user-select: none; -webkit-user-select: none; color: var(--text); }
      canvas { position: fixed; display: block; pointer-events: none; }
      #scene { z-index: 0; inset: 0; width: 100%; height: 100%; }
      #glass {
        z-index: 2;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      #appbar {
        position: fixed;
        z-index: 1;
        inset: 0 0 auto;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px 0 24px;
        color: var(--text);
      }
      #brand { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
      .chrome-button {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
        border-radius: 15px;
        background: linear-gradient(165deg, color-mix(in srgb, var(--raised) 94%, white 6%), var(--surface));
        color: var(--muted);
        box-shadow: inset 0 1px 0 color-mix(in srgb, white 24%, transparent), 0 2px 7px #0002;
        font: inherit;
        font-size: 22px;
        cursor: pointer;
      }
      .chrome-button:focus-visible, .nav-item:focus-visible, #system-theme:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      #sidebar {
        position: fixed;
        z-index: 1;
        top: 64px;
        bottom: 68px;
        left: 0;
        width: 200px;
        display: flex;
        flex-direction: column;
        padding: 20px 10px 12px;
        border-right: 1px solid color-mix(in srgb, var(--line) 62%, transparent);
        color: var(--text);
      }
      .sidebar-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px 12px; color: var(--muted); font-size: 12px; }
      .add-connection { border: 0; padding: 0 5px; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
      .sidebar-divider { height: 1px; margin: 8px 0; background: color-mix(in srgb, var(--line) 65%, transparent); }
      .nav-list { display: grid; gap: 3px; justify-items: center; }
      .nav-item {
        height: 42px;
        width: max-content;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-self: center;
        gap: 12px;
        padding: 0 13px;
        border: 1px solid color-mix(in srgb, var(--line) 62%, transparent);
        border-radius: 12px;
        background: linear-gradient(165deg, color-mix(in srgb, var(--raised) 75%, transparent), color-mix(in srgb, var(--surface) 82%, transparent));
        color: var(--muted);
        box-shadow: inset 0 1px 0 color-mix(in srgb, white 10%, transparent), 0 2px 5px #0002;
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: default;
      }
      .nav-item svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; }
      .nav-item.selected {
        border-color: color-mix(in srgb, var(--line) 85%, white 15%);
        background: linear-gradient(165deg, color-mix(in srgb, var(--raised) 90%, white 10%), var(--surface));
        color: var(--text);
        box-shadow: inset 0 1px 0 color-mix(in srgb, white 18%, transparent), 0 3px 8px #0002;
      }
      .sidebar-spacer { flex: 1; }
      #main-content {
        position: fixed;
        z-index: 1;
        top: 64px;
        right: 0;
        bottom: 68px;
        left: 200px;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
        color: var(--text);
      }
      #page-frame { width: min(1144px, 100%); padding: 28px 32px 40px; }
      #page-header { margin: 0 0 24px; }
      #page-title { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.25; }
      #page-subtitle { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
      .settings-group { margin: 0; }
      .settings-group h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; }
      .settings-group > p { margin: 8px 0 0; color: var(--text); font-size: 14px; line-height: 1.45; }
      #appearance-stage { position: relative; width: 100%; height: 270px; margin-top: 16px; }
      #system-theme {
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 8px auto 0;
        width: 206px;
        max-width: 100%;
        padding: 0 17px;
        border: 1px solid color-mix(in srgb, var(--line) 90%, white 10%);
        border-radius: 14px;
        background: linear-gradient(165deg, color-mix(in srgb, var(--raised) 96%, white 4%), var(--surface));
        color: var(--text);
        box-shadow: inset 0 1px 0 color-mix(in srgb, white 22%, transparent), inset 0 -1px 0 #0002, 0 3px 8px #0002;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #system-theme svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; }
      #system-theme[aria-pressed="true"] { border-color: color-mix(in srgb, var(--glow) 72%, var(--line)); box-shadow: inset 0 1px 0 color-mix(in srgb, white 24%, transparent), 0 0 14px color-mix(in srgb, var(--glow) 26%, transparent); }
      .settings-divider { height: 1px; margin: 32px 0 24px; background: color-mix(in srgb, var(--line) 70%, transparent); }
      .settings-group[aria-labelledby="appearance-heading"] + .settings-divider { margin-top: 40px; margin-bottom: 29px; }
      .settings-group[aria-labelledby="shortcut-heading"] + .settings-divider { margin-top: 34px; }
      .setting-row { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 14px; }
      #shortcut-heading + .setting-row { margin-top: 8px; }
      .shortcut { min-width: 94px; color: var(--muted); text-align: right; font-size: 12px; }
      .privacy-copy { max-width: 800px; margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
      #mini-player {
        position: fixed;
        z-index: 1;
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 68px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 16px;
        border-top: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        color: var(--muted);
        backdrop-filter: blur(16px);
      }
      .player-symbol { width: 30px; font-size: 19px; text-align: center; }
      .player-copy { min-width: 190px; display: grid; gap: 3px; }
      .player-copy strong { color: var(--text); font-size: 13px; font-weight: 500; }
      .player-copy span { font-size: 11px; }
      .player-progress { display: none; }
      .player-controls { display: flex; gap: 3px; }
      .player-controls .chrome-button { width: 44px; height: 44px; font-size: 16px; }
      #toggle {
        position: fixed;
        z-index: 3;
        left: 50%;
        top: 50%;
        width: 164px;
        height: 85px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: transparent;
        transform: translate(-50%, -50%);
        cursor: grab;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #toggle:active { cursor: grabbing; }
      #toggle:focus { outline: none; }
      #toggle.keyboard-focus {
        outline: 2px solid var(--focus-color, #bfe8ff);
        outline-offset: 6px;
        border-radius: 26px;
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--focus-color, #bfe8ff) 18%, transparent);
      }
      #fallback {
        display: none;
        position: fixed;
        z-index: 4;
        left: 50%;
        top: 60%;
        max-width: min(88vw, 420px);
        padding: 9px 13px;
        border: 1px solid #b8c8d4;
        border-radius: 8px;
        background: rgba(22, 22, 22, .92);
        color: #f5f5f5;
        font-size: 13px;
        text-align: center;
        transform: translateX(-50%);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 640px) {
        #sidebar { display: none; }
        #main-content { left: 0; bottom: 56px; }
        #page-frame { padding: 24px 20px 32px; }
        #mini-player { min-height: 56px; padding: 6px 12px; }
        .player-controls .chrome-button { width: 38px; height: 38px; }
        .player-copy { min-width: 0; }
        .player-copy span, .player-progress, .player-controls .skip { display: none; }
      }
      @media (max-height: 600px) and (min-width: 641px) {
        #main-content { overflow: auto; }
      }
    </style>
  </head>
  <body>
    <header id="appbar">
      <span id="brand">Aggregate</span>
      <div class="chrome-button" aria-hidden="true">⌕</div>
    </header>
    <aside id="sidebar" aria-label="主导航">
      <div class="sidebar-heading"><span>我的连接</span><span class="add-connection" aria-hidden="true">＋</span></div>
      <div class="sidebar-divider"></div>
      <nav class="nav-list">
        <div class="nav-item"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg><span>所有功能</span></div>
        <div class="nav-item"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="10" r="2.2"/><circle cx="15" cy="5" r="2.2"/><circle cx="15" cy="15" r="2.2"/><path d="m7 9 5.8-3M7 11l5.8 3"/></svg><span>管理连接</span></div>

    </aside>
    <main id="main-content" aria-labelledby="page-title">
      <div id="page-frame">
        <header id="page-header">
          <h1 id="page-title">设置</h1>

            aria-label="深色外观"
            aria-checked="false"
            aria-describedby="switch-help"
          >外观主题切换</button>
          <button id="system-theme" type="button" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.2"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4"/></svg>
            跟随 macOS 系统

    </main>
    <canvas id="scene" aria-hidden="true"></canvas>
    <canvas id="glass" aria-hidden="true"></canvas>
    <span id="switch-help" class="sr-only">点击切换，或从滑块开始左右拖动。也可以使用方向键。</span>
    <span id="switch-status" class="sr-only" aria-live="polite">已选择深色外观。</span>
    <p id="fallback" role="status">此页面需要 WebGL 才能绘制玻璃光学效果。仍可使用键盘切换外观。</p>
    <footer id="mini-player" aria-label="音乐播放器">
      <div class="player-symbol" aria-hidden="true">♫</div>
      <div class="player-copy"><strong>音乐播放器</strong><span>播放状态将在这里显示</span></div>
      <div class="player-progress" aria-hidden="true"></div>
      <div class="player-controls" aria-hidden="true">
        <div class="chrome-button skip">‹</div>
        <div class="chrome-button">▣</div>
        <div class="chrome-button skip">›</div>
        <div class="chrome-button">×</div>

    <script>
      (() => {
        'use strict';

        const sceneCanvas = document.querySelector('#scene');
        const glassCanvas = document.querySelector('#glass');
        const toggle = document.querySelector('#toggle');
        const status = document.querySelector('#switch-status');
        const fallback = document.querySelector('#fallback');
        const appearanceStage = document.querySelector('#appearance-stage');
        const systemTheme = document.querySelector('#system-theme');
        const systemColorScheme = window.matchMedia('(prefers-color-scheme: light)');
        const mainContent = document.querySelector('#main-content');
        const preferenceKey = 'aggregate-appearance';
        const storedPreference = (() => {
          try { return localStorage.getItem(preferenceKey); } catch { return null; }
        })();
        let followsSystem = storedPreference === 'system';
        const initialLight = storedPreference === 'light'
          || (followsSystem && systemColorScheme.matches);
        const sceneGl = sceneCanvas.getContext('webgl', {
          alpha: false, antialias: true, premultipliedAlpha: false,
          preserveDrawingBuffer: false, powerPreference: 'high-performance',
        });
        const gl = glassCanvas.getContext('webgl', {
          alpha: true, antialias: true, premultipliedAlpha: false,
          preserveDrawingBuffer: false, powerPreference: 'high-performance',
        });
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const unit = (v) => clamp(v, 0, 1);
        const smooth = (lo, hi, value) => {
          const t = unit((value - lo) / (hi - lo));
          return t * t * (3 - 2 * t);
        };
        const cubicInOut = (value) => value < 0.5
          ? 4 * value * value * value
          : 1 - Math.pow(-2 * value + 2, 3) / 2;
        let inputMode = 'pointer';

        const vertexSource = `
          attribute vec2 aPosition;
          void main() { gl_Position = vec4(aPosition, 0.0, 1.0); }
        `;

        // The page background and the switch are separate render layers, as in GlassScene.
        const sceneFragmentSource = `
          precision highp float;
          uniform vec2 uViewport;
          uniform float uDaylight;
          uniform float uSeconds;
          uniform float uDpr;
          float grain(vec2 point) {
            vec2 value = fract(point * vec2(443.897, 441.423));
            value += dot(value, value.yx + 19.19);
            return fract((value.x + value.y) * value.x);
          }
          void main() {
            vec2 screenPoint = vec2(gl_FragCoord.x / uDpr, uViewport.y - gl_FragCoord.y / uDpr);
            vec2 screenUv = screenPoint / uViewport;
            float sky = 1.0 - smoothstep(0.0, 1.5,
                length((screenUv - vec2(0.92, -0.08)) * vec2(1.0, 1.25)));
            vec3 color = mix(vec3(mix(0.040, 0.120, sky)),
                             vec3(mix(0.800, 0.925, sky)), uDaylight);
            vec2 physicalPixel = vec2(screenPoint.x, uViewport.y - screenPoint.y) * uDpr;
            color += (grain(physicalPixel + fract(uSeconds) * 91.7) - 0.5) * 0.022;
            gl_FragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
          }
        `;

        // Port of glass_theme_switch.frag: only the two particle-mask images are sampled.
        const switchFragmentSource = `
          precision highp float;
          uniform vec2 uViewport;
          uniform vec2 uOrigin;
          uniform float uZoom;
          uniform float uDisplayRatio;
          uniform vec2 uHandle;
          uniform vec2 uExtent;
          uniform float uRounding;
          uniform float uDaylight;
          uniform float uSeconds;
          uniform float uEnergy;
          uniform float uRaised;
          uniform float uOrbitAngle;
          uniform vec3 uLamp;
          uniform float uRefraction;
          uniform float uFrost;
          uniform float uPixelGlow;
          uniform float uStripHalfAngle;
          uniform vec2 uBackdropOrigin;
          uniform vec2 uBackdropSize;
          uniform sampler2D uMatrix;
          uniform sampler2D uDiffuse;
          const vec2 trackExtent = vec2(216.0, 112.0);
          const float trackRadius = 72.0;
          const vec2 textureExtent = vec2(552.0, 344.0);
          float roundedDistance(vec2 point, vec2 halfSize, float radius) {
            vec2 outside = abs(point) - halfSize + radius;
            return length(max(outside, 0.0)) + min(max(outside.x, outside.y), 0.0) - radius;
          }
          float handleDistance(vec2 point) {
            return roundedDistance(point - uHandle, uExtent, uRounding);
          }
          float stripDistance(vec2 point) {
            vec2 offset = point - uHandle;
            float angularError = atan(sin(atan(offset.y, offset.x) - uOrbitAngle),
                                      cos(atan(offset.y, offset.x) - uOrbitAngle));
            vec2 deviation = vec2(handleDistance(point) - 6.5,
                max(abs(angularError) - uStripHalfAngle, 0.0) * 104.0);
            return length(deviation) - 1.5;
          }
          vec3 illuminate(vec3 surface, float amount) {
            float coverage = min(0.88, 1.0 - exp(-amount * 1.3));
            vec3 tinted = mix(surface, uLamp * 1.04 + 0.03, coverage);
            return mix(surface + uLamp * amount, tinted, uDaylight);
          }
          float sampleMatrix(vec2 point, bool diffuse) {
            vec2 uv = point / textureExtent + 0.5;
            if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return 0.0;
            return diffuse ? texture2D(uDiffuse, uv).a : texture2D(uMatrix, uv).a;
          }
          vec4 underneath(vec2 point, float softness, vec2 chromatic) {
            float shading = smoothstep(-14.0, 3.0,
                roundedDistance(point - vec2(0.0, 7.0), trackExtent, trackRadius));
            vec3 floorColor = vec3(mix(0.030, 0.900, uDaylight));
            floorColor *= 1.0 + point.y / trackExtent.y * mix(0.05, 0.012, uDaylight);
            floorColor = mix(floorColor * (1.0 - shading * 0.6),
                             floorColor - shading * 0.085, uDaylight);
            float distanceToLight = max(stripDistance(point), 0.0);
            float wash = (0.85 * exp(-distanceToLight / 14.0) +
                          0.32 * exp(-distanceToLight / 55.0)) * uEnergy;
            floorColor = illuminate(floorColor, wash * 0.55);
            vec3 sharp = vec3(sampleMatrix(point - chromatic, false),
                              sampleMatrix(point, false),
                              sampleMatrix(point + chromatic, false));
            vec3 soft = vec3(sampleMatrix(point - chromatic, true),
                             sampleMatrix(point, true),
                             sampleMatrix(point + chromatic, true));
            vec3 coverage = clamp(mix(sharp, soft * 1.35, softness), 0.0, 1.0);
            float brightFloor = smoothstep(0.40, 0.56,
                dot(floorColor, vec3(0.299, 0.587, 0.114)));
            vec3 ink = mix(vec3(1.0, 0.965, 0.925), vec3(0.11, 0.105, 0.10), brightFloor);
            ink += mix(uLamp * wash * 0.9, vec3(0.25, 0.08, 0.0) * wash, uDaylight);
            vec3 result = mix(floorColor, ink, coverage);
            result += vec3(1.0, 0.78, 0.55) * sampleMatrix(point, true) * uPixelGlow * (1.0 - uDaylight);
            return vec4(result, coverage.g);
          }
          float grain(vec2 point) {
            vec2 value = fract(point * vec2(443.897, 441.423));
            value += dot(value, value.yx + 19.19);
            return fract((value.x + value.y) * value.x);
          }
          void main() {
            vec2 screenPoint = vec2(gl_FragCoord.x / uDisplayRatio,
                                    uViewport.y - gl_FragCoord.y / uDisplayRatio);
            vec2 point = (screenPoint - uOrigin) / uZoom;
            vec2 backgroundPoint = screenPoint;
            vec2 backgroundExtent = uViewport;
            if (uBackdropSize.x > 0.0 && uBackdropSize.y > 0.0) {
              backgroundPoint += uBackdropOrigin;
              backgroundExtent = uBackdropSize;
            }
            vec2 screenUv = backgroundPoint / backgroundExtent;
            float sky = 1.0 - smoothstep(0.0, 1.5,
                length((screenUv - vec2(0.92, -0.08)) * vec2(1.0, 1.25)));
            vec3 color = mix(vec3(mix(0.040, 0.120, sky)),
                             vec3(mix(0.800, 0.925, sky)), uDaylight);
            float trackDistance = roundedDistance(point, trackExtent, trackRadius);
            float shadow = 1.0 - smoothstep(-10.0, 34.0,
                roundedDistance(point - vec2(0.0, 14.0), trackExtent, trackRadius));
            color *= 1.0 - shadow * mix(0.5, 0.17, uDaylight);
            float contact = 1.0 - smoothstep(-2.0, 4.0,

          state.velocity = state.dragVelocity;
        }
        function beginDrag() {
          if (state.dragging) return;
          state.dragging = true;
          state.targetBeforeDrag = state.target;
          state.dragVelocity = 0;
        }
        function releaseDrag(cancel = false) {
          state.pressTarget = 0;
          if (!state.dragging) return;
          state.dragging = false;
          state.target = cancel
            ? state.targetBeforeDrag
            : state.position + (state.dragVelocity || 0) * motion.releaseProjection > 0.5 ? 1 : 0;
          state.kick = cancel ? 0 : 0.6;
          if (cancel) state.velocity = 0;
        }

        function progressFromPointer(point) {
          const start = -motion.knobTravel / 2;
          return state.position + (point.x - state.pointer.startX) / motion.knobTravel;
        }

        function requestRender() {
          if (!frameRequest) frameRequest = requestAnimationFrame(render);
        }

        document.addEventListener('keydown', () => { inputMode = 'keyboard'; }, true);
        document.addEventListener('pointerdown', () => { inputMode = 'pointer'; }, true);
        toggle.addEventListener('focus', () => {
          if (inputMode === 'keyboard') toggle.classList.add('keyboard-focus');
        });
        toggle.addEventListener('blur', () => toggle.classList.remove('keyboard-focus'));

        toggle.addEventListener('pointerdown', (event) => {
          if (event.button !== undefined && event.button !== 0) return;
          const point = designPoint(event.clientX, event.clientY);
          if (!insideTrack(point) || state.pointer) return;
          event.preventDefault();
          toggle.classList.remove('keyboard-focus');
          toggle.focus({ preventScroll: true });
          const startedOnHandle = snapshotHit(point);
          state.pointer = {
            id: event.pointerId,
            startX: point.x,
            startPosition: state.position < 0 ? state.position / motion.elasticity
              : state.position > 1 ? 1 + (state.position - 1) / motion.elasticity : state.position,
            lastPosition: state.position,
            lastTime: event.timeStamp,
            startTarget: state.target,
            startFollowsSystem: followsSystem,
            downX: event.clientX,
            downY: event.clientY,
            startedOnHandle,
            moved: 0,
            dragAccepted: false,
            tapRejected: false,
            dragRejected: !startedOnHandle || reducedMotion.matches,
            pendingMove: null,
          };
          state.pressTarget = 1;
          if (startedOnHandle && !reducedMotion.matches) beginDrag();
          if (toggle.setPointerCapture) toggle.setPointerCapture(event.pointerId);
          requestRender();
        });

        toggle.addEventListener('pointermove', (event) => {
          const pointer = state.pointer;
          if (!pointer || pointer.id !== event.pointerId) return;
          const dx = event.clientX - pointer.downX;
          const dy = event.clientY - pointer.downY;
          pointer.moved = Math.max(pointer.moved, Math.abs(dx) * sceneScale());
          if (pointer.startedOnHandle && !reducedMotion.matches && !pointer.dragAccepted
              && Math.abs(dx) * sceneScale() > 4 && Math.abs(dx) > Math.abs(dy)) {
            pointer.dragAccepted = true;
          }
          if (!pointer.dragAccepted) {
            pointer.pendingMove = event;
            return;
          }
          const point = designPoint(event.clientX, event.clientY);
          const nextPosition = pointer.startPosition + (point.x - pointer.startX) / motion.knobTravel;
          const dt = Math.max(0.001, (event.timeStamp - pointer.lastTime) / 1000);
          dragTo(nextPosition, (nextPosition - pointer.lastPosition) / dt, dt);
          pointer.lastPosition = state.position;
          pointer.lastTime = event.timeStamp;
          requestRender();
        });

        function finishPointer(event, cancel = false) {
          const pointer = state.pointer;
          if (!pointer || pointer.id !== event.pointerId) return;
          state.pointer = null;
          state.pressTarget = 0;
          if (toggle.hasPointerCapture?.(event.pointerId)) toggle.releasePointerCapture(event.pointerId);
          if (cancel) {
            releaseDrag(true);
            setLight(pointer.startTarget > 0.5, pointer.startFollowsSystem);
          } else if (pointer.dragAccepted && pointer.moved >= 4) {
            const projectedLight = state.position + (state.dragVelocity || 0) * motion.releaseProjection > 0.5;
            releaseDrag(false);
            setLight(projectedLight);
            state.kick = 0.6;
            state.dragVelocity = 0;
          } else {
            releaseDrag(true);
            setLight(!(pointer.startTarget > 0.5));
          }
          requestRender();
        }
        toggle.addEventListener('pointerup', (event) => finishPointer(event));
        toggle.addEventListener('pointercancel', (event) => finishPointer(event, true));

        toggle.addEventListener('click', (event) => {
          if (event.detail === 0 && !state.pointer) {
            if (performance.now() < state.suppressSyntheticClickUntil) {
              state.suppressSyntheticClickUntil = 0;
              return;
            }
            setLight(!(state.target > 0.5));
          }
        });
        toggle.addEventListener('keydown', (event) => {
          toggle.classList.add('keyboard-focus');
          if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
            event.preventDefault();
            setLight(true);
          } else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
            event.preventDefault();
            setLight(false);
          } else if (event.key === ' ' || event.key === 'Enter') {
            event.preventDefault();
            if (!event.repeat) {
              state.suppressSyntheticClickUntil = performance.now() + 350;
              setLight(!(state.target > 0.5));
            }
          }
        });
        toggle.addEventListener('pointerenter', () => { state.hoverTarget = 1; requestRender(); });
        toggle.addEventListener('pointerleave', () => { state.hoverTarget = 0; requestRender(); });
        systemTheme.addEventListener('click', () => setLight(systemColorScheme.matches, true));
        systemColorScheme.addEventListener?.('change', (event) => {
          if (followsSystem) setLight(event.matches, true);
        });

        function setUniforms(context, locations, frame) {
          const set1 = (name, value) => context.uniform1f(locations[name], value);
          const set2 = (name, x, y) => context.uniform2f(locations[name], x, y);
          set2('uViewport', state.sceneWidth, state.sceneHeight);
          set2('uOrigin', state.origin.x, state.origin.y);
          set1('uZoom', state.zoom);
          set1('uDisplayRatio', state.dpr);
          set2('uHandle', frame.knobX, 0);
          set2('uExtent', frame.halfWidth, frame.halfHeight);
          set1('uRounding', frame.radius);
          set1('uDaylight', frame.theme);
          set1('uSeconds', state.time);
          set1('uEnergy', frame.led);
          set1('uRaised', frame.lift);
          set1('uOrbitAngle', frame.theta);
          context.uniform3f(locations.uLamp,
            lampChannel(optics.moonRgb, optics.sunRgb, 16, frame.theme),
            lampChannel(optics.moonRgb, optics.sunRgb, 8, frame.theme),
            lampChannel(optics.moonRgb, optics.sunRgb, 0, frame.theme));
          set1('uRefraction', optics.refraction);
          set1('uFrost', optics.frost);
          set1('uPixelGlow', optics.pixelGlow);
          set1('uStripHalfAngle', optics.stripHalfAngle);
          set2('uBackdropOrigin', state.canvasLeft, state.canvasTop);
          set2('uBackdropSize', state.width, state.height);
        }
        function lampChannel(moon, sun, shift, daylight) {
          const a = (moon >> shift) & 255;
          const b = (sun >> shift) & 255;
          return (a + (b - a) * daylight) / 255;
        }

        function drawParticleTextures(frame) {
          matrixContext.setTransform(2, 0, 0, 2, 0, 0);
          matrixContext.clearRect(0, 0, textureExtent.width, textureExtent.height);
          for (const particle of frame.particles) {
            if (particle.alpha <= 0.002) continue;
            matrixContext.fillStyle = `rgba(255,255,255,${clamp(particle.alpha, 0, 1)})`;
            matrixContext.fillRect(
              276 + particle.x - particle.size * 0.5,
              172 + particle.y - particle.size * 0.5,
              particle.size,
              particle.size,
            );
          }
          diffuseContext.setTransform(1, 0, 0, 1, 0, 0);
          diffuseContext.clearRect(0, 0, textureExtent.width, textureExtent.height);
          diffuseContext.filter = 'blur(4px)';
          diffuseContext.drawImage(matrixCanvas, 0, 0, textureExtent.width, textureExtent.height);
          diffuseContext.filter = 'none';
        }

        function drawScene() {
          if (!sceneGl || !sceneProgram) return;
          sceneGl.useProgram(sceneProgram);
          sceneGl.uniform2f(sceneUniforms.uViewport, state.width, state.height);
          sceneGl.uniform1f(sceneUniforms.uDaylight, themeValue());
          sceneGl.uniform1f(sceneUniforms.uSeconds, state.time);
          sceneGl.uniform1f(sceneUniforms.uDpr, state.dpr);
          sceneGl.clearColor(0, 0, 0, 1);
          sceneGl.clear(sceneGl.COLOR_BUFFER_BIT);
          sceneGl.drawArrays(sceneGl.TRIANGLE_STRIP, 0, 4);
        }

        function drawSwitch(frame) {
          if (!gl || !switchProgram) return;
          drawParticleTextures(frame);
          gl.useProgram(switchProgram);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, matrixTexture);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, matrixCanvas);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, diffuseTexture);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, diffuseCanvas);
          gl.activeTexture(gl.TEXTURE0);
          setUniforms(gl, switchUniforms, frame);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        function advanceFrame(step, time) {
          state.time = time;
          if (!state.dragging) {
            const damping = 2 * Math.sqrt(motion.knobStiffness) * motion.knobDamping;
            const substep = step / 4;
            for (let i = 0; i < 4; i += 1) {
              const acceleration = -motion.knobStiffness * (state.position - state.target) - damping * state.velocity;
              state.velocity += acceleration * substep;
              state.position += state.velocity * substep;
            }
          }
          state.hover += (state.hoverTarget - state.hover) * Math.min(1, step * motion.hoverResponse);
          state.press += (state.pressTarget - state.press) * Math.min(1, step * motion.pressResponse);
          state.kick *= Math.exp(-step * motion.kickDecay);
          const progress = unitPosition();
          const desiredPhase = cubicInOut(progress);
          const phaseAcceleration = -motion.phaseStiffness * (state.phase - desiredPhase)
            - 2 * Math.sqrt(motion.phaseStiffness) * motion.phaseDamping * state.phaseVelocity;
          state.phaseVelocity += phaseAcceleration * step;
          state.phase += state.phaseVelocity * step;
          const phase = unit(state.phase);
          if (phase < 0.015) state.orbitDirection = 1;
          else if (phase > 0.985) state.orbitDirection = -1;
          for (const particle of particles) {
            const goal = particleGoal(particle, progress);
            const damping = 2 * Math.sqrt(particle.stiffness) * motion.particleDamping;
            particle.vx += (-particle.stiffness * (particle.x - goal.x) - damping * particle.vx) * step;
            particle.vy += (-particle.stiffness * (particle.y - goal.y) - damping * particle.vy) * step;
            particle.x += particle.vx * step;
            particle.y += particle.vy * step;
          }
        }

        function render(timestamp) {
          frameRequest = 0;
          const now = timestamp * 0.001;
          const rawDt = state.lastFrame ? Math.max(0, now - state.lastFrame) : 1 / 60;
          state.lastFrame = now;
          if (rawDt > 2 && !state.dragging) {
            snapTo(state.target > 0.5);
          } else {
            state.accumulator += Math.min(rawDt, 2);
            let steps = 0;
            while (state.accumulator + 1e-12 >= 1 / 60 && steps < 120) {
              advanceFrame(1 / 60, now - state.accumulator + 1 / 60);
              state.accumulator = Math.max(0, state.accumulator - 1 / 60);
              steps += 1;
            }
            state.time = now;
          }
          state.daylight = themeValue();
          updateSemantics();
          drawScene();
          drawSwitch(currentSnapshot());
          if (!reducedMotion.matches) requestRender();
        }

        function measure() {
          const width = window.innerWidth;
          const height = window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const sceneWidth = Math.max(1, Math.min(360, appearanceStage.getBoundingClientRect().width));
          const sceneHeight = sceneWidth * 0.75;
          appearanceStage.style.height = `${sceneHeight}px`;
          const stageRect = appearanceStage.getBoundingClientRect();
          const centerX = stageRect.left + stageRect.width * 0.5;
          const centerY = stageRect.top + stageRect.height * 0.5;
          const canvasLeft = centerX - sceneWidth * 0.5;
          const canvasTop = centerY - sceneHeight * 0.5;
          state.width = width;
          state.height = height;
          state.dpr = dpr;
          state.sceneWidth = sceneWidth;
          state.sceneHeight = sceneHeight;
          state.zoom = sceneWidth * 0.76 / 720;
          state.centerX = centerX;
          state.centerY = centerY;
          state.canvasLeft = canvasLeft;
          state.canvasTop = canvasTop;
          state.origin = sceneOrigin();

          const fullWidth = Math.round(width * dpr);
          const fullHeight = Math.round(height * dpr);
          if (sceneCanvas.width !== fullWidth || sceneCanvas.height !== fullHeight) {
            sceneCanvas.width = fullWidth;
            sceneCanvas.height = fullHeight;
            if (sceneGl) sceneGl.viewport(0, 0, fullWidth, fullHeight);
          }
          const switchWidth = Math.max(1, Math.round(sceneWidth * dpr));
          const switchHeight = Math.max(1, Math.round(sceneHeight * dpr));
          if (glassCanvas.width !== switchWidth || glassCanvas.height !== switchHeight) {
            glassCanvas.width = switchWidth;
            glassCanvas.height = switchHeight;
            if (gl) gl.viewport(0, 0, switchWidth, switchHeight);
          }
          for (const canvas of [glassCanvas, toggle]) {
            canvas.style.width = `${sceneWidth}px`;
            canvas.style.height = `${sceneHeight}px`;
            canvas.style.left = `${centerX}px`;
            canvas.style.top = `${centerY}px`;
          }
          toggle.style.width = `${432 * state.zoom}px`;
          toggle.style.height = `${224 * state.zoom}px`;
          fallback.style.left = `${centerX}px`;
          fallback.style.top = `${centerY + sceneHeight * 0.5 + 12}px`;
        }

        function initialize() {
          if (!sceneGl || !gl) return false;
          try {
            sceneProgram = compileProgram(sceneGl, sceneFragmentSource);
            switchProgram = compileProgram(gl, switchFragmentSource);
            sceneUniforms = uniformMap(sceneGl, sceneProgram, ['uViewport', 'uDaylight', 'uSeconds', 'uDpr']);
            switchUniforms = uniformMap(gl, switchProgram, [
              'uViewport', 'uOrigin', 'uZoom', 'uDisplayRatio', 'uHandle', 'uExtent',
              'uRounding', 'uDaylight', 'uSeconds', 'uEnergy', 'uRaised', 'uOrbitAngle',
              'uLamp', 'uRefraction', 'uFrost', 'uPixelGlow', 'uStripHalfAngle',
              'uBackdropOrigin', 'uBackdropSize',
            ]);
            matrixTexture = createTexture(gl, switchProgram, 0, 'uMatrix');
            diffuseTexture = createTexture(gl, switchProgram, 1, 'uDiffuse');
            gl.activeTexture(gl.TEXTURE0);
            return true;
          } catch (error) {
            console.error(error);
            return false;
          }
        }

        reducedMotion.addEventListener?.('change', () => {
          if (reducedMotion.matches) snapTo(state.target > 0.5);
          requestRender();
        });
        window.addEventListener('resize', () => { measure(); requestRender(); }, { passive: true });
        mainContent.addEventListener('scroll', () => { measure(); requestRender(); }, { passive: true });
        measure();
        if (!initialize()) fallback.style.display = 'block';
        updateSemantics();
        requestRender();
      })();
    </script>
